[package]
name = "lunchmoney-cli"
version = "0.2.0"
edition = "2024"
description = "Agent-friendly command line client for the Lunch Money API"
license = "MIT"

[[bin]]
name = "lunchmoney"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
terminal_size = "0.4"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
unicode-width = "0.2"
url = "2.5"
